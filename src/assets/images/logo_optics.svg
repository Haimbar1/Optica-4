<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Concentric green circles matching the "האופטיקה החברתית" logo -->
  <rect width="400" height="400" rx="40" fill="#F3F6E8" />

  <g transform="translate(200, 200)">
    <circle r="185" fill="#E1EDC8" />
    <circle r="160" fill="#D2E5B2" />
    <circle r="132" fill="#BCDA92" />
    <circle r="104" fill="#A6CF73" />
    <circle r="76" fill="#90C55A" />

    <!-- Line 1: האופטיקה -->
    <text
      x="0"
      y="-8"
      text-anchor="middle"
      fill="#111111"
      font-family="'Rubik', 'Assistant', sans-serif"
      font-size="64"
      font-weight="400"
    >
      האופטיקה
    </text>

    <!-- Line 2: החברתית -->
    <text
      x="0"
      y="62"
      text-anchor="middle"
      fill="#111111"
      font-family="'Rubik', 'Assistant', sans-serif"
      font-size="64"
      font-weight="400"
    >
      החברתית
    </text>
  </g>
</svg>
