<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Concentric Green Circles matching the uploaded logo.jfif -->
  <rect width="400" height="400" rx="40" fill="#FCFEF9" />

  <g transform="translate(200, 200)">
    <!-- Concentric Green Rings from light to deep vibrant green -->
    <circle r="185" fill="#EDF7E5" />
    <circle r="150" fill="#D8EECA" />
    <circle r="118" fill="#B7E2A0" />
    <circle r="88" fill="#88CF67" />
    <circle r="60" fill="#62B83E" />
    <circle r="36" fill="#4C9C29" />

    <!-- Text 1: האופטיקה הטובה -->
    <text
      x="0"
      y="-18"
      text-anchor="middle"
      fill="#0A1108"
      font-family="'Rubik', 'Assistant', 'Arial Black', sans-serif"
      font-size="34"
      font-weight="900"
      letter-spacing="0.5"
    >
      האופטיקה הטובה
    </text>

    <!-- Text 2: אופטיקה חברתית -->
    <text
      x="0"
      y="38"
      text-anchor="middle"
      fill="#0A1108"
      font-family="'Rubik', 'Assistant', sans-serif"
      font-size="44"
      font-weight="800"
      font-style="italic"
      letter-spacing="-0.5"
    >
      אופטיקה חברתית
    </text>
  </g>
</svg>
